name: Data Quality — Provider & Service

# The by-provider-and-service extract: ~10M rows, ~2GB, one row per provider
# per HCPCS code per place of service.
#
# Deliberately not on push. It costs a 2GB download and a much longer run
# than the by-provider pipeline, and nothing about a code change to the main
# contract needs it to re-run. Monthly, or on demand.

on:
  schedule:
    # First of the month, 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-quality-service
  cancel-in-progress: false

jobs:
  validate-service:
    name: GX Validation — PostgreSQL + Spark (10M rows)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gx_user
          POSTGRES_PASSWORD: gx_password
          POSTGRES_DB: medicare_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_CONN: postgresql+psycopg2://gx_user:gx_password@localhost:5432/medicare_db
      GX_SLACK_WEBHOOK_URL: ${{ secrets.GX_SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Free up disk space
        # The runner ships with ~14GB free; a 2GB CSV plus its Postgres copy
        # plus Spark's scratch space is uncomfortably close to that.
        #
        # Runs BEFORE setup-java, and does not touch $AGENT_TOOLSDIRECTORY.
        # That directory is where setup-java installs the JDK, so clearing it
        # afterwards deleted the runtime and Spark died with
        # JAVA_GATEWAY_EXITED on the first run of this workflow.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-spark.txt

      - name: Initialize GX context
        run: python -c "import great_expectations as gx; gx.get_context(mode='file')"

      - name: Download CMS provider-and-service data (cached)
        uses: actions/cache@v4.2.3
        id: cache-service
        with:
          path: data/raw/mup_phy_r25_p05_v20_d23_prov_svc.csv
          key: cms-mup-2023-service-v1

      - name: Pull data if not cached
        if: steps.cache-service.outputs.cache-hit != 'true'
        run: python pipelines/download_data.py --dataset service

      - name: Load to PostgreSQL
        run: python pipelines/load_to_postgres.py --dataset service

      - name: Validate — PostgreSQL
        run: python pipelines/validate_service.py --backend postgres

      - name: Validate — Spark
        run: python pipelines/validate_service.py --backend spark

      - name: Upload Data Docs as artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: data-docs-service
          path: gx/uncommitted/data_docs/local_site/
          retention-days: 30
