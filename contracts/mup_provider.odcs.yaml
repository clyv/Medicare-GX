apiVersion: v3.2.0
kind: DataContract
id: cms-mup-provider-2023
name: CMS Medicare Physician & Other Practitioners — by Provider
version: 1.0.0
status: active
domain: healthcare
dataProduct: medicare-mup-provider
tenant: Medicare-GX
description:
  purpose: Enforce one data contract across three execution environments (Pandas, PostgreSQL and Spark)
    on the CMS Medicare Physician & Other Practitioners by-provider extract.
  usage: 'Provider-level utilisation and payment analysis: one row per rendering NPI per service year.'
  limitations: CMS redacts any data element representing fewer than 11 beneficiaries, and top-codes chronic
    condition percentages at 75. Absent and capped values are expected, not defects. Figures cover Medicare
    fee-for-service Part B only.
authoritativeDefinitions:
- type: businessDefinition
  url: https://data.cms.gov/provider-summary-by-type-of-service/medicare-physician-other-practitioners/medicare-physician-other-practitioners-by-provider
  description: CMS dataset landing page.
- type: implementation
  url: https://github.com/clyv/Medicare-GX/blob/main/pipelines/contract.py
  description: Executable source of this document.
servers:
- server: local-postgres
  type: postgres
  host: localhost
  port: 5432
  database: medicare_db
  schema: public
  description: Docker Postgres used by the SQL validation leg.
- server: cms-csv
  type: local
  path: data/raw/mup_phy_r25_p05_v20_d23_prov.csv
  format: csv
  description: Raw CMS extract, validated on Pandas and Spark.
schema:
- name: mup_provider
  physicalName: mup_provider
  physicalType: table
  logicalType: object
  businessName: Medicare provider utilisation and payment summary
  description: One row per rendering NPI for the 2023 service year.
  dataGranularityDescription: One row per Rndrng_NPI.
  tags:
  - healthcare
  - medicare
  - cms
  - public
  quality:
  - name: expect_table_columns_to_match_set
    description: Catches upstream column additions and removals that per-column existence checks cannot
      see.
    dimension: conformity
    severity: error
    type: custom
    engine: greatExpectations
    implementation:
      expectation: expect_table_columns_to_match_set
      kwargs:
        column_set:
        - Rndrng_NPI
        - Rndrng_Prvdr_Last_Org_Name
        - Rndrng_Prvdr_First_Name
        - Rndrng_Prvdr_MI
        - Rndrng_Prvdr_Crdntls
        - Rndrng_Prvdr_Ent_Cd
        - Rndrng_Prvdr_St1
        - Rndrng_Prvdr_St2
        - Rndrng_Prvdr_City
        - Rndrng_Prvdr_State_Abrvtn
        - Rndrng_Prvdr_State_FIPS
        - Rndrng_Prvdr_Zip5
        - Rndrng_Prvdr_RUCA
        - Rndrng_Prvdr_RUCA_Desc
        - Rndrng_Prvdr_Cntry
        - Rndrng_Prvdr_Type
        - Rndrng_Prvdr_Mdcr_Prtcptg_Ind
        - Tot_HCPCS_Cds
        - Tot_Benes
        - Tot_Srvcs
        - Tot_Sbmtd_Chrg
        - Tot_Mdcr_Alowd_Amt
        - Tot_Mdcr_Pymt_Amt
        - Tot_Mdcr_Stdzd_Amt
        - Drug_Sprsn_Ind
        - Drug_Tot_HCPCS_Cds
        - Drug_Tot_Benes
        - Drug_Tot_Srvcs
        - Drug_Sbmtd_Chrg
        - Drug_Mdcr_Alowd_Amt
        - Drug_Mdcr_Pymt_Amt
        - Drug_Mdcr_Stdzd_Amt
        - Med_Sprsn_Ind
        - Med_Tot_HCPCS_Cds
        - Med_Tot_Benes
        - Med_Tot_Srvcs
        - Med_Sbmtd_Chrg
        - Med_Mdcr_Alowd_Amt
        - Med_Mdcr_Pymt_Amt
        - Med_Mdcr_Stdzd_Amt
        - Bene_Avg_Age
        - Bene_Age_LT_65_Cnt
        - Bene_Age_65_74_Cnt
        - Bene_Age_75_84_Cnt
        - Bene_Age_GT_84_Cnt
        - Bene_Feml_Cnt
        - Bene_Male_Cnt
