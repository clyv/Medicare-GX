  - name: expect_table_column_count_to_be_between
    description: Coarse guard on schema drift between CMS releases.
    dimension: conformity
    severity: warning
    type: custom
    engine: greatExpectations
    implementation:
      expectation: expect_table_column_count_to_be_between
      kwargs:
        min_value: 70.0
        max_value: 95.0
  - name: expect_table_row_count_to_be_between
    description: Roughly 1.26M providers per service year.
    dimension: coverage
    severity: error
    type: library
    metric: rowCount
    mustBeBetween:
    - 1000000
    - 15000000
  properties:
  - name: Rndrng_NPI
    logicalType: string
    physicalType: text
    required: true
    primaryKey: true
    quality:
    - name: expect_column_to_exist
      description: Read directly by the load and validate steps.
      dimension: conformity
      severity: error
      type: custom
      engine: greatExpectations
      implementation:
        expectation: expect_column_to_exist
        kwargs:
          column: Rndrng_NPI
    - name: expect_column_values_to_not_be_null
      description: Never null in any released MUP file.
      dimension: completeness
      severity: error
      type: library
      metric: nullValues
      mustBe: 0
    - name: expect_column_value_lengths_to_equal
      description: NPI is a fixed 10-character identifier.
      dimension: conformity
      severity: error
      type: custom
      engine: greatExpectations
      implementation:
        expectation: expect_column_value_lengths_to_equal
        kwargs:
          column: Rndrng_NPI
          value: 10.0
    - name: expect_column_values_to_match_regex
      description: Length alone would accept 10 letters.
      dimension: conformity
      severity: error
      type: custom
      engine: greatExpectations
      implementation:
        expectation: expect_column_values_to_match_regex
        kwargs:
          column: Rndrng_NPI
          regex: ^\d{10}$
    - name: expect_column_values_to_be_valid_npi
      description: NPI check digit, per the Luhn formula CMS specifies over the 80840 prefix. No format
        rule can catch a bad check digit.
      dimension: conformity
      severity: error
      type: custom
      engine: greatExpectations
      implementation:
        expectation: expect_column_values_to_be_valid_npi
        kwargs:
          column: Rndrng_NPI
    - name: expect_column_values_to_be_unique
      description: The by-provider file holds one row per NPI.
      dimension: uniqueness
      severity: error
      type: library
      metric: duplicateValues
      mustBe: 0
    - name: expect_column_proportion_of_unique_values_to_be_between
      description: States the one-row-per-NPI rule as a proportion.
      dimension: uniqueness
      severity: warning
      type: custom
      engine: greatExpectations
      implementation:
        expectation: expect_column_proportion_of_unique_values_to_be_between
        kwargs:
          column: Rndrng_NPI
          min_value: 1.0
          max_value: 1.0
