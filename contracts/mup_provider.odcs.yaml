        - Bene_Race_Black_Cnt
        - Bene_Race_API_Cnt
        - Bene_Race_Hspnc_Cnt
        - Bene_Race_NatInd_Cnt
        - Bene_Race_Othr_Cnt
        - Bene_Dual_Cnt
