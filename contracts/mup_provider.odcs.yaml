slaProperties:
- property: frequency
  value: 1
  unit: y
  driver: regulatory
- property: latency
  value: 18
  unit: m
  driver: regulatory
support:
- channel: github-issues
  tool: other
  url: https://github.com/clyv/Medicare-GX/issues
  scope: issues
tags:
- healthcare
- data-contract
- great-expectations
customProperties:
- property: validationEngine
  value: great_expectations==1.19.1
- property: executionEnvironments
  value:
  - pandas
  - postgres
  - spark
- property: severityModel
  value: error = blocking tier, fails CI. warning = advisory tier, reported in Data Docs and promoted
    to error once a live run shows the rule holds.
