        kwargs:
          column: Tot_Sbmtd_Chrg
          min_value: 0.0
    - name: expect_column_pair_values_a_to_be_greater_than_b
      description: Submitted charge sits above the allowed amount (all services). Medicare pays the lesser
        of the two, so a provider billing under the fee schedule legitimately inverts this; the tolerance
        is sized to the 0.004% that do.
      dimension: consistency
      severity: warning
      type: custom
      engine: greatExpectations
      implementation:
        expectation: expect_column_pair_values_a_to_be_greater_than_b
        kwargs:
          column_A: Tot_Sbmtd_Chrg
          column_B: Tot_Mdcr_Alowd_Amt
          mostly: 0.999
          or_equal: true
          ignore_row_if: either_value_is_missing
